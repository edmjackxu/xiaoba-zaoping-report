<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小八早评 - 头条博主新内容</title>
  <link rel="stylesheet" href="css/style.css?v=20260706">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🔔 小八早评</h1>
      <div class="meta" id="meta-container">加载中...</div>
      <div class="nav-links">
        <a href="index.html" class="active">📋 全部内容</a>
        <a href="doubao.html">🤖 豆包回复</a>
        <a href="video-content-to-text.html">📝 视频转录</a>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats-container">
      <div class="stat-item"><div class="number">-</div><div class="label">🎬 视频</div></div>
      <div class="stat-item"><div class="number">-</div><div class="label">📄 文章</div></div>
      <div class="stat-item"><div class="number">-</div><div class="label">🤖 豆包回复</div></div>
      <div class="stat-item"><div class="number">-</div><div class="label">📊 总计</div></div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="video">🎬 视频</button>
      <button class="filter-btn" data-filter="article">📄 文章</button>
      <button class="filter-btn" data-filter="doubao">🤖 豆包回复</button>
    </div>

    <!-- 博主导航 -->
    <div id="creator-nav"></div>

    <!-- Content -->
    <div id="content-container">
      <div class="loading">加载中...</div>
    </div>

    <!-- Footer -->
    <div class="footer">
      自动生成 - 小八早评系统
    </div>
  </div>

  <!-- 返回顶部 -->
  <a href="#" class="back-to-top" id="back-to-top">↑</a>

  <script src="js/app.js?v=20260706"></script>
  <script>
    (async function () {
      try {
        // 加载数据
        const [itemsData, metaData] = await Promise.all([
          XiaobaReport.loadData('data/videos_and_articles.json'),
          XiaobaReport.loadData('data/meta.json')
        ]);

        // 渲染 meta
        XiaobaReport.renderMeta(metaData);

        // 合并视频和文章
        const allItems = [
          ...(itemsData.videos || []).map(v => ({ ...v, type: 'video' })),
          ...(itemsData.articles || []).map(a => ({ ...a, type: 'article' }))
        ];

        // 渲染统计
        const doubaoCount = allItems.filter(i => i.doubaoReply).length;
        XiaobaReport.renderStats({
          videos: (itemsData.videos || []).length,
          articles: (itemsData.articles || []).length,
          doubaoReplies: doubaoCount,
          total: allItems.length
        });

        // 渲染列表
        XiaobaReport.renderItemList(allItems, 'content-container');

        // 设置筛选
        XiaobaReport.setupFilters(allItems, 'content-container');

        // 设置朗读
        XiaobaReport.setupTTS();

        // 设置返回顶部
        XiaobaReport.setupBackToTop();

      } catch (err) {
        document.getElementById('content-container').innerHTML =
          '<div class="error-msg">❌ 加载失败：' + XiaobaReport.escapeHtml(err.message) + '</div>';
      }
    })();
  </script>
</body>
</html>
